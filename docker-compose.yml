services:
  app:
    build: .
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: news_aggregator
      DB_USER: news
      DB_PASSWORD: ${DB_PASSWORD:-news}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      APP_TIMEZONE: Europe/Moscow
    depends_on:
      migrate:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    expose:
      - "9000"

  importer:
    build: .
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: news_aggregator
      DB_USER: news
      DB_PASSWORD: ${DB_PASSWORD:-news}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      APP_TIMEZONE: Europe/Moscow
    depends_on:
      migrate:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    command: sh -c 'while true; do php bin/import-rss.php || echo "RSS import failed; retrying on next schedule" >&2; sleep 300; done'
    healthcheck:
      test: ["CMD", "php", "bin/health-importer.php"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  migrate:
    build: .
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: news_aggregator
      DB_USER: news
      DB_PASSWORD: ${DB_PASSWORD:-news}
      APP_TIMEZONE: Europe/Moscow
    depends_on:
      mysql:
        condition: service_healthy
    command: php bin/migrate.php

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: news_aggregator
      MYSQL_USER: news
      MYSQL_PASSWORD: ${DB_PASSWORD:-news}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-locally}
    command: --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  memcached:
    image: memcached:1.6-alpine
    command: memcached -m 64 -I 2m -o modern

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    volumes:
      - .:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql-data:
